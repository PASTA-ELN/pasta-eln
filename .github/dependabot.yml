version: 2
multi-ecosystem-groups:
  all:
    schedule:
      interval: monthly
    assignees: [SteffenBrinckmann]

updates:
  - package-ecosystem: pip
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all
    ignore:
      - dependency-name: PySide6
        versions: ['>=6.11']
      - dependency-name: PySide6_Addons
        versions: ['>=6.11']
      - dependency-name: PySide6_Essentials
        versions: ['>=6.11']

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all
