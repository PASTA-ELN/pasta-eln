name: Install and verify

on:
  push:
  pull_request:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ] # Check table https://wiki.qt.io/Qt_for_Python to find supported

    steps:
    - name: Checkout content
      uses: actions/checkout@v3
    - name: Install ubuntu dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install libegl1
    - name: Set up ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip cache purge
        pip install -r requirements-linux.txt
        pip install coverage pytest pytest-qt pytest-qt-app pytest-mock pytest-timeout coverage typing-extensions qt_material
    - name: Check installation
      run: |
        coverage run --source=pasta_eln -m pasta_eln.installation_tools
    - name: Installation
      run: |
        coverage run --source=pasta_eln -a -m pasta_eln.installation_tools install pasta_data
        ls ~
        echo '----------'
        ls ~/pasta_data
    - name: Check installation
      run: |
        coverage run --source=pasta_eln -a -m pasta_eln.installation_tools
    - name: Create example data
      run: |
        coverage run --source=pasta_eln -a -m pasta_eln.installation_tools example
        tree ~/pasta_data
    - name: Run tests
      run: |
        coverage run --source=pasta_eln -a -m pytest -s -x --tb=short tests
        coverage html -i
      shell: bash
      env:
        QT_QPA_PLATFORM: "offscreen"
    - name: Upload log
      uses: actions/upload-artifact@v4
      with:
        name: artifact_${{ matrix.python-version }}
        path: |
          ~/pastaELN.log
          ~/.pastaELN*.json
          ~/pasta_data/pastaELN.db
          htmlcov/
          artifacts/
      if: ${{ always() }}
